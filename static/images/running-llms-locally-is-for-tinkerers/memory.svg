<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 420' width='1100' height='420' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' role='img' aria-label='Memory use: 126B model about 87 GB versus 27B model about 20 GB'><rect width='1100' height='420' rx='18' fill='#fcfcfb'/><text x='60' y='56' font-size='26' fill='#0b0b0b' font-weight='700' text-anchor='start'>Where 128 GB of memory went</text><text x='60' y='84' font-size='15' fill='#52514e' font-weight='400' text-anchor='start'>The CPU and GPU share one pool. Approximate, from macOS memory readings while each model ran.</text><rect x='60.0' y='108' width='14.0' height='14' rx='3' fill='#b9b6ae'/><text x='80' y='120' font-size='13' fill='#52514e' font-weight='400' text-anchor='start'>macOS + apps</text><rect x='190.0' y='108' width='14.0' height='14' rx='3' fill='#2f6fde'/><text x='210.0' y='120' font-size='13' fill='#52514e' font-weight='400' text-anchor='start'>Model weights</text><rect x='327.5' y='108' width='14.0' height='14' rx='3' fill='#e0892b'/><text x='347.5' y='120' font-size='13' fill='#52514e' font-weight='400' text-anchor='start'>KV cache + scratch</text><rect x='502.5' y='108' width='14.0' height='14' rx='3' fill='#ecebe7'/><text x='522.5' y='120' font-size='13' fill='#52514e' font-weight='400' text-anchor='start'>Free</text><text x='60' y='164' font-size='16' fill='#0b0b0b' font-weight='700' text-anchor='start'>Qwen3.8-Flash-Next (126B MoE, 4-bit): all 512 experts per layer stay loaded</text><rect x='60.0' y='178' width='105.2' height='44' rx='4' fill='#b9b6ae'/><text x='113.59375' y='206' font-size='14' fill='#0b0b0b' font-weight='600' text-anchor='middle'>14 GB</text><rect x='167.2' y='178' width='633.5' height='44' rx='4' fill='#2f6fde'/><text x='484.921875' y='206' font-size='14' fill='#ffffff' font-weight='600' text-anchor='middle'>83 GB</text><rect x='802.7' y='178' width='28.6' height='44' rx='4' fill='#e0892b'/><rect x='833.3' y='178' width='204.7' height='44' rx='4' fill='#ecebe7'/><text x='936.640625' y='206' font-size='14' fill='#0b0b0b' font-weight='600' text-anchor='middle'>27 GB</text><text x='60' y='274' font-size='16' fill='#0b0b0b' font-weight='700' text-anchor='start'>Qwen3.8-27B (dense, 4-bit)</text><rect x='60.0' y='288' width='105.2' height='44' rx='4' fill='#b9b6ae'/><text x='113.59375' y='316' font-size='14' fill='#0b0b0b' font-weight='600' text-anchor='middle'>14 GB</text><rect x='167.2' y='288' width='151.1' height='44' rx='4' fill='#2f6fde'/><text x='243.75' y='316' font-size='14' fill='#ffffff' font-weight='600' text-anchor='middle'>20 GB</text><rect x='320.3' y='288' width='13.3' height='44' rx='4' fill='#e0892b'/><rect x='335.6' y='288' width='702.4' height='44' rx='4' fill='#ecebe7'/><text x='687.8125' y='316' font-size='14' fill='#0b0b0b' font-weight='600' text-anchor='middle'>92 GB</text><text x='60' y='366' font-size='14' fill='#52514e' font-weight='400' text-anchor='start'>Running low made macOS compress memory and swap, and the model server refused requests: it looked like slowness.</text><text x='60' y='390' font-size='14' fill='#52514e' font-weight='400' text-anchor='start'>Stopping the 126B model took free memory from 21% to 88%.</text></svg>