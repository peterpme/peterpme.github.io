<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 454' width='1100' height='454' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' role='img' aria-label='Attention weights for the token it: cat gets 0.81'><rect width='1100' height='454' rx='18' fill='#fcfcfb'/><text x='60' y='56' font-size='26' fill='#0b0b0b' font-weight='700' text-anchor='start'>How “it” decides what to look at</text><text x='60' y='84' font-size='15' fill='#52514e' font-weight='400' text-anchor='start'>Its query is compared with every earlier key. Softmax turns the scores into weights that add up to 1.</text><text x='60' y='128' font-size='13' fill='#8a8985' font-weight='600' text-anchor='start'>Token</text><text x='230' y='128' font-size='13' fill='#8a8985' font-weight='600' text-anchor='start'>Score (Q · K)</text><text x='420' y='128' font-size='13' fill='#8a8985' font-weight='600' text-anchor='start'>Weight after softmax</text><text x='860' y='128' font-size='13' fill='#8a8985' font-weight='600' text-anchor='start'></text><rect x='60.0' y='150' width='140.0' height='34' rx='6' fill='#ecebe7'/><text x='130' y='172' font-size='15' fill='#0b0b0b' font-weight='500' text-anchor='middle'>The</text><text x='230' y='172' font-size='15' fill='#0b0b0b' font-weight='400' text-anchor='start'>0.8</text><rect x='420.0' y='156' width='360.0' height='22' rx='4' fill='#ecebe7'/><rect x='420.0' y='156' width='8.0' height='22' rx='4' fill='#b9b6ae'/><text x='790' y='173' font-size='15' fill='#0b0b0b' font-weight='400' text-anchor='start'>0.02</text><rect x='60.0' y='194' width='140.0' height='34' rx='6' fill='#2f6fde'/><text x='130' y='216' font-size='15' fill='#ffffff' font-weight='700' text-anchor='middle'>cat</text><text x='230' y='216' font-size='15' fill='#0b0b0b' font-weight='700' text-anchor='start'>4.4</text><rect x='420.0' y='200' width='360.0' height='22' rx='4' fill='#ecebe7'/><rect x='420.0' y='200' width='294.1' height='22' rx='4' fill='#2f6fde'/><text x='790' y='217' font-size='15' fill='#0b0b0b' font-weight='700' text-anchor='start'>0.82</text><rect x='60.0' y='238' width='140.0' height='34' rx='6' fill='#ecebe7'/><text x='130' y='260' font-size='15' fill='#0b0b0b' font-weight='500' text-anchor='middle'>sat</text><text x='230' y='260' font-size='15' fill='#0b0b0b' font-weight='400' text-anchor='start'>1.6</text><rect x='420.0' y='244' width='360.0' height='22' rx='4' fill='#ecebe7'/><rect x='420.0' y='244' width='17.9' height='22' rx='4' fill='#b9b6ae'/><text x='790' y='261' font-size='15' fill='#0b0b0b' font-weight='400' text-anchor='start'>0.05</text><rect x='60.0' y='282' width='140.0' height='34' rx='6' fill='#ecebe7'/><text x='130' y='304' font-size='15' fill='#0b0b0b' font-weight='500' text-anchor='middle'>because</text><text x='230' y='304' font-size='15' fill='#0b0b0b' font-weight='400' text-anchor='start'>1.3</text><rect x='420.0' y='288' width='360.0' height='22' rx='4' fill='#ecebe7'/><rect x='420.0' y='288' width='13.3' height='22' rx='4' fill='#b9b6ae'/><text x='790' y='305' font-size='15' fill='#0b0b0b' font-weight='400' text-anchor='start'>0.04</text><rect x='60.0' y='326' width='140.0' height='34' rx='6' fill='#ecebe7'/><text x='130' y='348' font-size='15' fill='#0b0b0b' font-weight='500' text-anchor='middle'>it</text><text x='230' y='348' font-size='15' fill='#0b0b0b' font-weight='400' text-anchor='start'>2.0</text><rect x='420.0' y='332' width='360.0' height='22' rx='4' fill='#ecebe7'/><rect x='420.0' y='332' width='26.7' height='22' rx='4' fill='#b9b6ae'/><text x='790' y='349' font-size='15' fill='#0b0b0b' font-weight='400' text-anchor='start'>0.07</text><text x='60' y='400' font-size='16' fill='#0b0b0b' font-weight='600' text-anchor='start'>Output for “it” = 0.82 × value(cat) + 0.07 × value(it) + 0.05 × value(sat) + …</text><text x='60' y='426' font-size='14' fill='#52514e' font-weight='400' text-anchor='start'>The weights are computed fresh for every sentence. The tables that make Q, K and V are the learned parameters.</text></svg>