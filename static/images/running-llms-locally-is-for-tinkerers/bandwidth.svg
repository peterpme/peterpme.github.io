<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 460' width='1100' height='460' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' role='img' aria-label='Memory bandwidth: M4 Max versus NVIDIA GPUs'><rect width='1100' height='460' rx='18' fill='#fcfcfb'/><text x='60' y='56' font-size='26' fill='#0b0b0b' font-weight='700' text-anchor='start'>Memory bandwidth decides how fast text comes out</text><text x='60' y='84' font-size='15' fill='#52514e' font-weight='400' text-anchor='start'>Best case for writing text ≈ bandwidth ÷ bytes read per token. Here: a 20 GB model, one user, no MTP.</text><text x='60' y='146' font-size='15' fill='#0b0b0b' font-weight='700' text-anchor='start'>M4 Max (my laptop)</text><text x='60' y='165' font-size='12' fill='#8a8985' font-weight='400' text-anchor='start'>128 GB unified memory</text><rect x='330.0' y='130' width='38.2' height='26' rx='4' fill='#e0892b'/><text x='378.22' y='149' font-size='14' fill='#0b0b0b' font-weight='700' text-anchor='start'>546 GB/s · ~27 tok/s</text><text x='60' y='204' font-size='15' fill='#0b0b0b' font-weight='500' text-anchor='start'>DGX Spark</text><text x='60' y='223' font-size='12' fill='#8a8985' font-weight='400' text-anchor='start'>128 GB unified memory</text><rect x='330.0' y='188' width='19.1' height='26' rx='4' fill='#2f6fde'/><text x='359.11' y='207' font-size='14' fill='#0b0b0b' font-weight='400' text-anchor='start'>273 GB/s · ~14 tok/s</text><text x='60' y='262' font-size='15' fill='#0b0b0b' font-weight='500' text-anchor='start'>RTX 5090</text><text x='60' y='281' font-size='12' fill='#8a8985' font-weight='400' text-anchor='start'>32 GB, consumer card</text><rect x='330.0' y='246' width='125.4' height='26' rx='4' fill='#2f6fde'/><text x='465.44' y='265' font-size='14' fill='#0b0b0b' font-weight='400' text-anchor='start'>1,792 GB/s · ~90 tok/s</text><text x='60' y='320' font-size='15' fill='#0b0b0b' font-weight='500' text-anchor='start'>H100</text><text x='60' y='339' font-size='12' fill='#8a8985' font-weight='400' text-anchor='start'>80 GB HBM, datacenter</text><rect x='330.0' y='304' width='234.5' height='26' rx='4' fill='#2f6fde'/><text x='574.5' y='323' font-size='14' fill='#0b0b0b' font-weight='400' text-anchor='start'>3,350 GB/s · ~168 tok/s</text><text x='60' y='378' font-size='15' fill='#0b0b0b' font-weight='500' text-anchor='start'>B200</text><text x='60' y='397' font-size='12' fill='#8a8985' font-weight='400' text-anchor='start'>~180 GB HBM, datacenter</text><rect x='330.0' y='362' width='560.0' height='26' rx='4' fill='#2f6fde'/><text x='900.0' y='381' font-size='14' fill='#0b0b0b' font-weight='400' text-anchor='start'>8,000 GB/s · ~400 tok/s</text><text x='60' y='432' font-size='14' fill='#52514e' font-weight='400' text-anchor='start'>Datacenter GPUs also have far more compute for reading prompts, and serve dozens of users per read of the weights.</text></svg>