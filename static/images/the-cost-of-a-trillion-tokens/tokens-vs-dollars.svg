<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 440' width='1100' height='440' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif'><rect width='1100' height='440' rx='18' fill='#fcfcfb'/><text x='60' y='60' font-size='26' fill='#0b0b0b' font-weight='700' text-anchor='start' >1.5 trillion tokens a month: what they are vs. what they cost</text><text x='60' y='90' font-size='15' fill='#52514e' font-weight='400' text-anchor='start' >Opus 5.5 at list, realistic agent mix. Reads are 98% of the tokens and 57% of the dollars.</text><text x='204' y='160' font-size='16' fill='#0b0b0b' font-weight='700' text-anchor='end' >Tokens</text><text x='204' y='180' font-size='12' fill='#8a8985' font-weight='400' text-anchor='end' >1.5T</text><rect x='220.0' y='130' width='782.0' height='52' rx='4' fill='#2a78d6'/><rect x='1004.0' y='130' width='11.4' height='52' rx='4' fill='#eb6834'/><rect x='1017.4' y='130' width='1.0' height='52' rx='4' fill='#1baf7a'/><rect x='1019.8' y='130' width='1.0' height='52' rx='4' fill='#eda100'/><text x='204' y='260' font-size='16' fill='#0b0b0b' font-weight='700' text-anchor='end' >Dollars</text><text x='204' y='280' font-size='12' fill='#8a8985' font-weight='400' text-anchor='end' >$511k</text><rect x='220.0' y='230' width='458.0' height='52' rx='4' fill='#2a78d6'/><rect x='680.0' y='230' width='194.0' height='52' rx='4' fill='#eb6834'/><rect x='876.0' y='230' width='138.8' height='52' rx='4' fill='#1baf7a'/><rect x='1016.8' y='230' width='1.2' height='52' rx='4' fill='#eda100'/><text x='450.0' y='262' font-size='14' fill='#fcfcfb' font-weight='700' text-anchor='middle' >$294k · 57%</text><text x='778.0' y='262' font-size='14' fill='#fcfcfb' font-weight='700' text-anchor='middle' >$125k · 25%</text><text x='946.4' y='262' font-size='14' fill='#fcfcfb' font-weight='700' text-anchor='middle' >$90k · 18%</text><text x='612.0' y='162' font-size='14' fill='#fcfcfb' font-weight='700' text-anchor='middle' >98% cache reads · $0.20 per million</text><text x='1020' y='206' font-size='12' fill='#52514e' font-weight='400' text-anchor='end' >↑ the other 2%: writes, output, fresh input</text><rect x='220' y='330' width='14' height='14' rx='3' fill='#2a78d6'/><text x='240' y='342' font-size='13' fill='#52514e' font-weight='400' text-anchor='start' >Cache reads</text><rect x='349.4' y='330' width='14' height='14' rx='3' fill='#eb6834'/><text x='369.4' y='342' font-size='13' fill='#52514e' font-weight='400' text-anchor='start' >Cache writes</text><rect x='486.2' y='330' width='14' height='14' rx='3' fill='#1baf7a'/><text x='506.2' y='342' font-size='13' fill='#52514e' font-weight='400' text-anchor='start' >Output</text><rect x='578.6' y='330' width='14' height='14' rx='3' fill='#eda100'/><text x='598.6' y='342' font-size='13' fill='#52514e' font-weight='400' text-anchor='start' >Uncached input</text><text x='60' y='400' font-size='13' fill='#8a8985' font-weight='400' text-anchor='start' >Priced at $8 per million, the same tokens would be $12M a month. The mistake was pricing the 98% as if it were the 2%.</text></svg>