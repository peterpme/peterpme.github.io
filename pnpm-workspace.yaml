packages:
  - "."

# Astro 7.4.0 was published the same day as this upgrade. pnpm 11's default
# one-day release delay would reject the lockfile.
minimumReleaseAge: 0

# pnpm 11 does not run dependency build scripts unless they are listed here.
# sharp stays off so install uses the prebuilt @img binary instead of compiling
# against a system libvips.
allowBuilds:
  esbuild: true
  sharp: false
  workerd: true
