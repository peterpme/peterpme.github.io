packages:
  - "."

# One day, in minutes. pnpm 11 will not install a package published sooner.
minimumReleaseAge: 1440

# pnpm 11 does not run dependency build scripts unless they are listed here.
# sharp stays off so install uses the prebuilt @img binary instead of compiling
# against a system libvips.
allowBuilds:
  esbuild: true
  sharp: false
  workerd: true

# GHSA-px8p-9vwx-vf98. satori and @shuding/opentype.js still request 0.7.3.
overrides:
  fflate: 0.7.5
